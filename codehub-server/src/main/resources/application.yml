server:
  port: 8080

spring:
  application:
    name: codehub-server

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/codehub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: ${JWT_SECRET:CodeHubSecretKey2026VeryLongSecretForHS256Algorithm}
  expiration: 86400000  # 24小时

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:codehub}

# LLM配置（OpenAI兼容协议，支持DeepSeek/阿里云百炼/小米等）
llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  api-key: ${LLM_API_KEY:sk-placeholder}
  model: ${LLM_MODEL:deepseek-chat}
  embedding-url: ${EMBEDDING_URL:https://api.siliconflow.cn/v1}
  embedding-key: ${EMBEDDING_KEY:sk-placeholder}
  embedding-model: ${EMBEDDING_MODEL:BAAI/bge-small-zh-v1.5}

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.codehub: DEBUG
